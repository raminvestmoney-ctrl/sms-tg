name: Daily Traffic Boost

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Runs every 20 minutes (72 times a day)
    # 72 * 25 hits = 1800 hits/day (above the 1000 goal)
    - cron: '*/20 * * * *'
  workflow_dispatch:

    # Allows manual trigger from GitHub UI

jobs:
  traffic-job:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.41.0-jammy # Microsoft's official image with all deps
    timeout-minutes: 15

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        pip install playwright-stealth==1.0.6 aiohttp==3.9.3

    - name: Run Traffic Loader
      run: python3 advanced_traffic_loader.py
      env:
        CI_MODE: "true"
        PYTHONUNBUFFERED: "1"




