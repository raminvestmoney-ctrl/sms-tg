name: Daily Traffic Boost

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Runs every 20 minutes (72 times a day)
    # 72 * 25 hits = 1800 hits/day (above the 1000 goal)
    - cron: '*/20 * * * *'
  workflow_dispatch:

    # Allows manual trigger from GitHub UI

jobs:
  traffic-job:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Ensure the job doesn't run forever if something hangs

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright==1.41.0 playwright-stealth==1.0.6 aiohttp==3.9.3 flask requests gunicorn

    - name: Install Playwright Chromium
      run: |
        python -m playwright install --with-deps chromium

    - name: Run Traffic Loader
      run: python3 advanced_traffic_loader.py
      env:
        CI_MODE: "true"
        PYTHONUNBUFFERED: "1"



