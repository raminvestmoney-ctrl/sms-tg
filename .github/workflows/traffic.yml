name: Daily Traffic Boost

on:
  schedule:
    # Runs every 20 minutes (72 times a day)
    # 72 * 25 hits = 1800 hits/day (above the 1000 goal)
    - cron: '*/20 * * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub UI

jobs:
  traffic-job:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Ensure the job doesn't run forever if something hangs

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: |
        python -m playwright install chromium
        python -m playwright install-deps chromium

    - name: Run Traffic Loader
      run: python advanced_traffic_loader.py
      env:
        CI_MODE: "true"

